name: news_app
description: News app with Clean Architecture, BLoC and Firebase — journalists can publish their own articles.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # state management
  flutter_bloc: ^8.1.2
  flutter_hooks: ^0.18.3

  # comparing dart objects
  equatable: ^2.0.5

  # service locator
  get_it: ^7.6.0

  # date formatting
  intl: ^0.20.2

  # localization
  flutter_localizations:
    sdk: flutter

  # persisted app settings (theme/locale/accent/a11y)
  shared_preferences: ^2.3.3

  # local database (favorites cache)
  sqflite: ^2.4.4

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

  # media
  cached_network_image: ^3.2.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5

  # ids for Storage paths
  uuid: ^4.6.0

  # network reachability, for the offline banner in AppShell
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  bloc_test: ^9.1.7
  mocktail: ^1.0.4


flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/legal/

  # Both families ship as single variable-font files (wght axis); Skia
  # interpolates the requested FontWeight from them directly, so no
  # per-weight asset entries are declared.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/figtree/Figtree.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk.ttf

# App icon: generated from assets/branding/icon.png (opaque) +
# icon_foreground.png (Android adaptive foreground). See ROADMAP.md, Fase 7.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#0B0A07"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  remove_alpha_ios: true

# Native splash: light/dark backgrounds match config/theme/app_colors.dart
# (stageLight/stageDark). android_12 uses the icon foreground because
# Android 12+ ignores the classic splash image API. See ROADMAP.md, Fase 7.
flutter_native_splash:
  color: "#F1F0ED"
  color_dark: "#050403"
  image: assets/branding/splash.png
  image_dark: assets/branding/splash_dark.png
  android_12:
    image: assets/branding/icon_foreground.png
    icon_background_color: "#0B0A07"
    image_dark: assets/branding/icon_foreground.png
    icon_background_color_dark: "#0B0A07"
