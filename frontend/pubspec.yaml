name: news_app
description: News app with Clean Architecture, BLoC and Firebase — journalists can publish their own articles.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # state management
  flutter_bloc: ^8.1.2
  flutter_hooks: ^0.18.3

  # comparing dart objects
  equatable: ^2.0.5

  # service locator
  get_it: ^7.6.0

  # date formatting
  intl: ^0.18.1

  # local database (favorites cache)
  floor: ^1.5.0
  sqflite: ^2.4.4

  # remote API client (NewsAPI)
  retrofit: ^4.10.0
  dio: ^5.9.0

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

  # media
  cached_network_image: ^3.2.0
  image_picker: ^1.2.3

  # ids for Storage paths
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^8.2.1
  floor_generator: ^1.5.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8


flutter:

  uses-material-design: true

 
  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
