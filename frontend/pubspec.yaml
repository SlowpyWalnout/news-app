name: news_app
description: News app with Clean Architecture, BLoC and Firebase — journalists can publish their own articles.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # state management
  flutter_bloc: ^8.1.2
  flutter_hooks: ^0.18.3

  # comparing dart objects
  equatable: ^2.0.5

  # service locator
  get_it: ^7.6.0

  # date formatting
  intl: ^0.20.2

  # localization
  flutter_localizations:
    sdk: flutter

  # persisted app settings (theme/locale/accent/a11y)
  shared_preferences: ^2.3.3

  # local database (favorites cache)
  floor: ^1.5.0
  sqflite: ^2.4.4

  # remote API client (NewsAPI)
  retrofit: ^4.10.0
  dio: ^5.9.0

  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

  # media
  cached_network_image: ^3.2.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5

  # ids for Storage paths
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^8.2.1
  floor_generator: ^1.5.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  # NOTE: bloc_test/mocktail are NOT added here — floor_generator ^1.5.0 (no
  # newer version exists) pins analyzer ^6.4.1, which conflicts with every
  # test_api version bloc_test's `test` dependency chain can resolve to.
  # Fase 5 tests below use plain flutter_test (bloc.stream + expectLater) and
  # hand-written fakes instead. Revisit in Fase 8 if Floor gets dropped.


flutter:

  uses-material-design: true
  generate: true

  # Both families ship as single variable-font files (wght axis); Skia
  # interpolates the requested FontWeight from them directly, so no
  # per-weight asset entries are declared.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/figtree/Figtree.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk.ttf
